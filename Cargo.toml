[workspace]
resolver = "2"
members = [
    "crates/cairn-types",
    "crates/cairn-config",
    "crates/cairn-identity",
    "crates/cairn-file",
    "crates/cairn-vcs",
    "crates/cairn-app",
    "crates/cairn-protocol",
    "crates/cairn-storage",
    "crates/cairn-daemon-client",
    "crates/cairn-daemon",
    "crates/cairn-cli",
    "crates/cairn-harness-sim",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/treygoff24/cairn"
authors = ["Trey Goff"]

# Shared dependencies are pinned here so crate versions cannot drift during
# parallel development.
[workspace.dependencies]
cairn-types = { path = "crates/cairn-types" }
cairn-config = { path = "crates/cairn-config" }
cairn-identity = { path = "crates/cairn-identity" }
cairn-protocol = { path = "crates/cairn-protocol" }
cairn-storage = { path = "crates/cairn-storage" }
cairn-daemon-client = { path = "crates/cairn-daemon-client" }
cairn-daemon = { path = "crates/cairn-daemon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Content addressing. BLAKE3 is THE content-hash algorithm for FileVersion and the
# working-tree digest — fast on the read/edit hot path. Do not substitute per crate.
blake3 = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tempfile = "3"
# Durable storage: bundled SQLite (compiled from source) for the WAL event log and
# the daemon lease DB. Pinned once here; cairn-storage and cairn-daemon inherit.
rusqlite = { version = "0.32", features = ["bundled"] }

# Centralized lints keep crate-local checks consistent. Unsafe code stays opt-in
# for crates that eventually need it, such as mmap snapshot storage.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
